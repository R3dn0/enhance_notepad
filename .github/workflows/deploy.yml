name: Build CSS Tailwind

on:
  push:
    branches: [main]
    paths-ignore: ['assets/app.css']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Commit generated CSS
        run: |
          git config user.name "R3dn0"
          git config user.email "64706773+R3dn0@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add assets/app.css
          if git diff --cached --quiet; then
            echo "Aucun changement CSS"
          else
            git commit -m "build(css): compile Tailwind"
            git push
          fi
